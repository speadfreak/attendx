openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AttendX intelligent attendance and Pi operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: students
    description: Student management
  - name: classrooms
    description: Classroom management
  - name: attendance
    description: Attendance tracking
  - name: sms
    description: SMS notification logs
  - name: face
    description: Face recognition
  - name: dashboard
    description: Dashboard analytics
  - name: pi
    description: Raspberry Pi device health and operations
  - name: jobs
    description: Background job queue
  - name: reviews
    description: Low-confidence attendance review
  - name: system
    description: Device settings and telemetry
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current admin info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List all students
      security:
        - bearerAuth: []
      parameters:
        - name: classroomId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a new student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentBody"
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentBody"
      responses:
        "200":
          description: Student updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Student deleted

  /classrooms:
    get:
      operationId: listClassrooms
      tags: [classrooms]
      summary: List all classrooms
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of classrooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Classroom"
    post:
      operationId: createClassroom
      tags: [classrooms]
      summary: Create a classroom
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassroomBody"
      responses:
        "201":
          description: Classroom created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"

  /classrooms/{id}:
    get:
      operationId: getClassroom
      tags: [classrooms]
      summary: Get a classroom
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Classroom found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"
    patch:
      operationId: updateClassroom
      tags: [classrooms]
      summary: Update a classroom
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassroomBody"
      responses:
        "200":
          description: Classroom updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classroom"
    delete:
      operationId: deleteClassroom
      tags: [classrooms]
      summary: Delete a classroom
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Classroom deleted

  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance logs
      security:
        - bearerAuth: []
      parameters:
        - name: classroomId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: studentId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: date
          in: query
          required: false
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Attendance logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceLog"
    post:
      operationId: createAttendance
      tags: [attendance]
      summary: Mark attendance manually
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttendanceBody"
      responses:
        "201":
          description: Attendance marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceLog"

  /attendance/{id}:
    patch:
      operationId: updateAttendance
      tags: [attendance]
      summary: Update attendance record
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttendanceBody"
      responses:
        "200":
          description: Attendance updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceLog"

  /attendance/today:
    get:
      operationId: getTodayAttendance
      tags: [attendance]
      summary: Get today's live attendance feed
      security:
        - bearerAuth: []
      parameters:
        - name: classroomId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Today's attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceLog"

  /face/encode:
    post:
      operationId: encodeFace
      tags: [face]
      summary: Encode and store a face for a student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncodeFaceBody"
      responses:
        "200":
          description: Face encoded and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceEncodeResponse"
        "400":
          description: No face detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /face/recognize:
    post:
      operationId: recognizeFace
      tags: [face]
      summary: Recognize a face and mark attendance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecognizeFaceBody"
      responses:
        "200":
          description: Face recognized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceRecognizeResponse"
        "404":
          description: No match found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sms-logs:
    get:
      operationId: listSmsLogs
      tags: [sms]
      summary: List SMS notification logs
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: ["string", "null"]
        - name: studentId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: SMS logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SmsLog"

  /sms-logs/retry-failed:
    post:
      operationId: retryFailedSmsLogs
      tags: [sms]
      summary: Re-send every failed/undelivered SMS that has no newer retry attempt
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 40
                  default: 40
      responses:
        "200":
          description: Bulk retry summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsRetryAllResult"

  /sms-logs/{id}/retry:
    post:
      operationId: retrySmsLog
      tags: [sms]
      summary: Re-send one failed/undelivered SMS log entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Retry attempt outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsRetryResult"
        "400":
          description: Invalid log id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: SMS log not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Row not retryable or a retry is already in flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent attendance activity feed
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceLog"

  /dashboard/attendance-trend:
    get:
      operationId: getAttendanceTrend
      tags: [dashboard]
      summary: Get attendance trend for the past 7 days
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Attendance trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceTrendPoint"

  /dashboard/classroom-summary:
    get:
      operationId: getClassroomSummary
      tags: [dashboard]
      summary: Get per-classroom attendance summary for today
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Classroom summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassroomAttendanceSummary"

  /pi/pair:
    post:
      operationId: pairPiDevice
      tags: [pi]
      summary: Pair the Pi and issue a short-lived session token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PiPairingInput"
      responses:
        "200":
          description: One-time Pi session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiPairingResponse"

  /pi/status:
    get:
      operationId: getPiStatus
      tags: [pi]
      summary: Get Pi connection and telemetry status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pi status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiStatus"

  /pi/heartbeat:
    post:
      operationId: piHeartbeat
      tags: [pi]
      summary: Send Pi health heartbeat and rotate its session token
      security:
        - piToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PiHeartbeatInput"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiHeartbeatResponse"

  /pi/actions:
    post:
      operationId: createPiAction
      tags: [pi, jobs]
      summary: Queue one approved Pi maintenance action
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PiActionInput"
      responses:
        "201":
          description: Action queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /pi/sessions/kill:
    post:
      operationId: killPiSessions
      tags: [pi]
      summary: Revoke the Pi session and cancel active operations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pi session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillSessionsResponse"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List recent jobs and queue counts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent jobs and status counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobQueueSummary"

  /jobs/next:
    get:
      operationId: claimNextPiJob
      tags: [jobs]
      summary: Claim the next Pi job
      security:
        - piToken: []
      responses:
        "200":
          description: Job claim result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobClaim"

  /jobs/{id}/complete:
    post:
      operationId: completePiJob
      tags: [jobs]
      summary: Report a Pi job result
      security:
        - piToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCompletionInput"
      responses:
        "200":
          description: Job result saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}/retry:
    post:
      operationId: retryJob
      tags: [jobs]
      summary: Retry a failed job
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job returned to the queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /attendance/bulk-match:
    post:
      operationId: bulkMatchAttendance
      tags: [attendance, face]
      summary: Match a sequence of gate-camera face descriptors
      security:
        - piToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMatchInput"
      responses:
        "200":
          description: Matched, reviewed, and skipped faces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkMatchResponse"

  /reviews:
    get:
      operationId: listMatchReviews
      tags: [reviews]
      summary: List pending and recent face-match reviews
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchReview"

  /reviews/{id}/decision:
    post:
      operationId: decideMatchReview
      tags: [reviews]
      summary: Approve or reject a low-confidence match
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionInput"
      responses:
        "200":
          description: Review decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecisionResponse"

  /system/settings:
    get:
      operationId: getSystemSettings
      tags: [system]
      summary: Get attendance confidence and retention settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"
    patch:
      operationId: updateSystemSettings
      tags: [system]
      summary: Update confidence threshold and review retention
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemSettingsInput"
      responses:
        "200":
          description: Updated system settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"

  /system/fan-override:
    post:
      operationId: setFanOverride
      tags: [system, jobs]
      summary: Queue a fan mode override for the Pi
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FanOverrideInput"
      responses:
        "201":
          description: Fan override queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /dashboard/confidence-heatmap:
    get:
      operationId: getConfidenceHeatmap
      tags: [dashboard, face]
      summary: Get historical low-confidence matches by student and classroom
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Confidence review aggregates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfidenceHeatmapPoint"

  /attendance/records/clear-preview:
    get:
      operationId: previewAttendanceClear
      tags: [attendance]
      summary: Count manual or automated attendance rows before clearing
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
            enum: [manual, automated]
      responses:
        "200":
          description: Matching attendance row count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceClearPreview"

  /attendance/records:
    delete:
      operationId: clearAttendanceRecords
      tags: [attendance]
      summary: Delete manual or automated attendance records after confirmation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceClearInput"
      responses:
        "200":
          description: Attendance rows deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceClearResponse"

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [system]
      summary: View recent administrator and automated audit events
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Recent audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    piToken:
      type: apiKey
      in: header
      name: X-Pi-Token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        admin:
          $ref: "#/components/schemas/Admin"
      required:
        - token
        - admin

    Admin:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - role
        - createdAt

    Student:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        studentId:
          type: string
        classroomId:
          type: ["integer", "null"]
        classroomName:
          type: ["string", "null"]
        parentPhone:
          type: string
        photoUrl:
          type: ["string", "null"]
        qrCode:
          type: ["string", "null"]
        hasFaceEncoding:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - name
        - studentId
        - classroomId
        - classroomName
        - parentPhone
        - photoUrl
        - qrCode
        - hasFaceEncoding
        - createdAt

    CreateStudentBody:
      type: object
      properties:
        name:
          type: string
        studentId:
          type: string
        classroomId:
          type: ["integer", "null"]
        parentPhone:
          type: string
        photoUrl:
          type: ["string", "null"]
      required:
        - name
        - studentId
        - parentPhone

    UpdateStudentBody:
      type: object
      properties:
        name:
          type: string
        classroomId:
          type: ["integer", "null"]
        parentPhone:
          type: string
        photoUrl:
          type: ["string", "null"]

    Classroom:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        teacherName:
          type: ["string", "null"]
        studentCount:
