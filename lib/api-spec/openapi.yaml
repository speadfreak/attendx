    SmsLog:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: integer
        studentName:
          type: string
        parentPhone:
          type: string
        message:
          type: string
        status:
          type: string
        provider:
          type: string
        sentAt:
          type: string
        errorMessage:
          type: ["string", "null"]
        # Phase 6: manual extension — re-add after orval regen
        channel:
          type: ["string", "null"]
        errorCode:
          type: ["string", "null"]
        providerSid:
          type: ["string", "null"]
        statusUpdatedAt:
          type: ["string", "null"]
        # Retry lineage — retryOfId points at the original failed row when
        # this row is a re-send; hasRetry flags rows already re-sent once.
        retryOfId:
          type: ["integer", "null"]
        hasRetry:
          type: boolean
        errorHint:
          type: ["object", "null"]
          properties:
            title:
              type: string
            fix:
              type: string
            retryable:
              type: boolean
            channelSwitchable:
              type: boolean
      required:
        - id
        - studentId
        - studentName
        - parentPhone
        - message
        - status
        - provider
        - sentAt
        - errorMessage
        - hasRetry

    SmsRetryResult:
      type: object
      description: Outcome of one SMS retry attempt
      properties:
        originalLogId:
          type: integer
          description: The failed sms_logs row the retry was launched from
        retryLogId:
          type: ["integer", "null"]
          description: The NEW attempt row written for this retry (null when even bookkeeping failed)
        status:
          type: ["string", "null"]
          description: Status the new attempt row was created with (queued/sent/failed/simulated)
        error:
          type: ["string", "null"]
          description: Human-readable failure reason, null when the gateway accepted the message
      required:
        - originalLogId
        - retryLogId
        - status
        - error

    SmsRetryAllResult:
      type: object
      description: Summary of a bulk "retry all failed" run
      properties:
        attempted:
          type: integer
        accepted:
          type: integer
          description: Attempts the gateway accepted (new row queued/sent)
        failed:
          type: integer
          description: Attempts rejected before the gateway accepted
        skipped:
          type: integer
          description: Rows skipped because a retry was already in flight
        results:
          type: array
          items:
            $ref: "#/components/schemas/SmsRetryResult"
      required:
        - attempted
        - accepted
        - failed
        - skipped
        - results

