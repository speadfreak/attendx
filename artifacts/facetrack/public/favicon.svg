<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AttendX — verified face-scan attendance">
  <!--
    AttendX Phase 7 icon — "verified face scan".
    Design brief baked into the geometry:
      - dark slate-950 (#020617) rounded square, full-bleed so `purpose: maskable`
        launchers can crop it to any shape;
      - emerald-500 (#10b981) to violet-500 (#8b5cf6) gradient motif carried by
        the scan slice + corner glows + pulse dot;
      - white camera-focus bracket frame around a minimal shield silhouette with
        an emerald check (verified identity at the gate);
      - a small violet pulse dot (live sensor heartbeat) tucked in the top-right
        of the frame with a short trailing arc.
    All critical marks sit inside the W3C maskable safe zone (inner 80%, r=205
    around the center). The bracket/shield strokes are >=24px so the mark still
    reads at a 16 px favicon size.
  -->
  <defs>
    <linearGradient id="gx-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="gx-depth" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="gx-glow-emerald" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gx-glow-violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed tile (the generator script squares this off for maskable PNGs) -->
  <rect id="gx-bg" width="512" height="512" rx="112" fill="url(#gx-depth)"/>

  <g id="gx-art" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- gradient motif: soft corner glows -->
    <circle cx="170" cy="178" r="152" fill="url(#gx-glow-emerald)" stroke="none"/>
    <circle cx="362" cy="352" r="152" fill="url(#gx-glow-violet)" stroke="none"/>

    <!-- face-scan bracket frame (camera focus box) -->
    <g stroke="#f8fafc" stroke-width="32">
      <path d="M122 198 V142 a20 20 0 0 1 20-20 H198"/>
      <path d="M314 122 H370 a20 20 0 0 1 20 20 V198"/>
      <path d="M390 314 V370 a20 20 0 0 1-20 20 H314"/>
      <path d="M198 390 H142 a20 20 0 0 1-20-20 V314"/>
    </g>

    <!-- minimal shield silhouette (identity, verified at the gate) -->
    <path d="M256 158 L338 190 V266 C338 320 306 352 256 372 C206 352 174 320 174 266 V190 Z"
          fill="#020617" stroke="#f8fafc" stroke-width="26"/>

    <!-- emerald check -->
    <path d="M228 266 L252 292 L298 232" stroke="#10b981" stroke-width="30"/>

    <!-- emerald-to-violet scan slice across the shield -->
    <rect x="186" y="312" width="140" height="10" rx="5" fill="url(#gx-scan)" stroke="none" opacity="0.95"/>

    <!-- violet pulse dot + trailing arc (live sensor heartbeat) -->
    <circle cx="322" cy="165" r="17" fill="#8b5cf6" stroke="none"/>
    <path d="M330 140 A26 26 0 0 1 347 160" stroke="#8b5cf6" stroke-width="6" opacity="0.55"/>
  </g>
</svg>
